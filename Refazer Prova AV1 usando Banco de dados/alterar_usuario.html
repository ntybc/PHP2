<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar usuário</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Alterar usuário</h1>

    <!-- Aqui aparecem as mensagens de sucesso ou de erro que o PHP mandou -->
    <div id="mensagem"></div>

    <!-- O formulário só aparece depois que o PHP mandar os dados do usuário -->
    <form id="form_usuario" style="display:none">
        <p>
            <label>Nome:</label><br>
            <input type="text" id="nome_usuario" size="50" required>
        </p>

        <p>
            <label>Data de nascimento:</label><br>
            <input type="date" id="data_nascimento" required>
        </p>

        <p>
            <label>CPF:</label><br>
            <input type="text" id="cpf_usuario" size="20" maxlength="14" required>
        </p>

        <p>
            <label>E-mail:</label><br>
            <input type="email" id="email_usuario" size="50" required>
        </p>

        <p>
            <label>Nova senha (deixe em branco para manter a atual):</label><br>
            <input type="password" id="senha_usuario">
        </p>

        <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="listar_usuarios.html">Voltar para a lista</a> | <a href="index.html">Menu</a></p>

    <script src="js/funcoes.js"></script>
    <script>
        // Pega o id que veio no endereço: alterar_usuario.html?id_usuario=1
        const id_usuario = pegarParametro("id_usuario");
        const formulario = document.getElementById("form_usuario");

        // Não deixa escolher data no futuro no calendário (o PHP também confere)
        document.getElementById("data_nascimento").max = new Date().toLocaleDateString("sv-SE");

        // 1) Busca o usuário no PHP e preenche o formulário (a senha não vem)
        async function carregarUsuario() {
            try {
                const json = await chamarApi("api/usuarios.php?acao=ver&id_usuario=" + encodeURIComponent(id_usuario));
                const usuario = json.usuario;

                document.getElementById("nome_usuario").value = usuario.nome_usuario;
                document.getElementById("data_nascimento").value = usuario.data_nascimento;
                document.getElementById("cpf_usuario").value = usuario.cpf_formatado;
                document.getElementById("email_usuario").value = usuario.email_usuario;

                formulario.style.display = "block";
            } catch (erro) {
                mostrarErro(erro);
            }
        }

        // 2) Quando clicar em salvar, manda os dados novos para o PHP
        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const dados = {
                id_usuario: id_usuario,
                nome_usuario: document.getElementById("nome_usuario").value,
                data_nascimento: document.getElementById("data_nascimento").value,
                cpf_usuario: document.getElementById("cpf_usuario").value,
                email_usuario: document.getElementById("email_usuario").value,
                senha_usuario: document.getElementById("senha_usuario").value
            };

            try {
                const json = await chamarApi("api/usuarios.php?acao=alterar", dados);
                mostrarMensagem(json.mensagem, "sucesso");
                document.getElementById("senha_usuario").value = "";
            } catch (erro) {
                mostrarErro(erro);
            }
        });

        carregarUsuario();
    </script>
</body>
</html>
