<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listar perguntas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Perguntas cadastradas</h1>

    <!-- Aqui aparece a mensagem de sucesso ou de erro que o PHP mandou -->
    <div id="mensagem"></div>

    <!-- A lista é montada pelo JavaScript com o JSON que o PHP devolve -->
    <ul id="lista_perguntas"></ul>

    <p><a href="criar_pergunta.html">Criar pergunta de múltipla escolha</a> | <a href="criar_pergunta_texto.html">Criar pergunta de texto</a> | <a href="index.html">Menu</a></p>

    <script src="js/funcoes.js"></script>
    <script>
        // Pede a lista para o PHP e monta os <li> na tela
        async function carregarPerguntas() {
            const lista = document.getElementById("lista_perguntas");

            try {
                const json = await chamarApi("api/perguntas.php?acao=listar");

                if (json.perguntas.length === 0) {
                    lista.innerHTML = "<p>Nenhuma pergunta cadastrada ainda.</p>";
                    return;
                }

                let html = "";

                for (const pergunta of json.perguntas) {
                    // Cada tipo de pergunta tem a sua tela de alterar
                    let pagina_alterar = "alterar_pergunta.html";
                    let nome_tipo = "múltipla escolha";

                    if (pergunta.tipo_pergunta === "texto") {
                        pagina_alterar = "alterar_pergunta_texto.html";
                        nome_tipo = "texto";
                    }

                    html += `
                        <li>
                            ${pergunta.id_pergunta}. ${escaparHtml(pergunta.texto_pergunta)}
                            <em>(${nome_tipo})</em>

                            <a href="ver_pergunta.html?id_pergunta=${pergunta.id_pergunta}">Ver</a>
                            <a href="${pagina_alterar}?id_pergunta=${pergunta.id_pergunta}">Alterar</a>
                            <button type="button" class="botao-excluir" onclick="excluirPergunta('${pergunta.id_pergunta}')">Excluir</button>
                        </li>`;
                }

                lista.innerHTML = html;
            } catch (erro) {
                mostrarErro(erro);
            }
        }

        // Manda o id para o PHP excluir e depois recarrega a lista
        async function excluirPergunta(id_pergunta) {
            if (!confirm("Tem certeza que deseja excluir esta pergunta e suas respostas?")) {
                return;
            }

            try {
                const json = await chamarApi("api/perguntas.php?acao=excluir", { id_pergunta: id_pergunta });
                mostrarMensagem(json.mensagem, "sucesso");
                carregarPerguntas();
            } catch (erro) {
                mostrarErro(erro);
            }
        }

        // Assim que a página abre, já carrega a lista
        carregarPerguntas();
    </script>
</body>
</html>
