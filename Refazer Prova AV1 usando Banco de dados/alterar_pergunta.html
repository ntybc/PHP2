<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar pergunta</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Alterar pergunta</h1>

    <!-- Aqui aparece a mensagem de sucesso ou de erro que o PHP mandou -->
    <div id="mensagem"></div>

    <!-- O formulário só aparece depois que o PHP mandar os dados da pergunta -->
    <form id="form_pergunta" style="display:none">
        <p>
            <label>Pergunta:</label><br>
            <textarea id="texto_pergunta" rows="3" cols="60" required></textarea>
        </p>

        <p>Respostas (marque a correta):</p>

        <div id="lista_respostas"></div>

        <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="listar_perguntas.html">Voltar para a lista</a> | <a href="index.html">Menu</a></p>

    <script src="js/funcoes.js"></script>
    <script>
        // Pega o id que veio no endereço: alterar_pergunta.html?id_pergunta=1
        const id_pergunta = pegarParametro("id_pergunta");
        const formulario = document.getElementById("form_pergunta");

        // 1) Busca a pergunta no PHP e preenche o formulário
        async function carregarPergunta() {
            try {
                const json = await chamarApi("api/perguntas.php?acao=ver&id_pergunta=" + encodeURIComponent(id_pergunta));
                const pergunta = json.pergunta;

                if (pergunta.tipo_pergunta === "texto") {
                    document.getElementById("mensagem").innerHTML =
                        `<p>Esta pergunta não é de múltipla escolha. <a href="alterar_pergunta_texto.html?id_pergunta=${pergunta.id_pergunta}">Alterar como pergunta de texto</a></p>`;
                    return;
                }

                document.getElementById("texto_pergunta").value = pergunta.texto_pergunta;

                // Monta as 5 respostas: a resposta número 1 está na posição 0 da lista, e assim por diante
                let html_respostas = "";
                for (let numero = 1; numero <= 5; numero++) {
                    let texto_resposta = "";
                    let marcada = "";

                    const resposta = pergunta.respostas[numero - 1];
                    if (resposta) {
                        texto_resposta = resposta.texto_resposta;
                        if (resposta.is_resposta_certa) {
                            marcada = "checked";
                        }
                    }

                    html_respostas += `
                        <p>
                            <input type="radio" name="resposta_certa" value="${numero}" ${marcada} required>
                            <input type="text" id="resposta_${numero}" size="60" value="${escaparHtml(texto_resposta)}" required>
                        </p>`;
                }
                document.getElementById("lista_respostas").innerHTML = html_respostas;

                formulario.style.display = "block";
            } catch (erro) {
                mostrarErro(erro);
            }
        }

        // 2) Quando clicar em salvar, manda os dados novos para o PHP
        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const radio_marcado = document.querySelector('input[name="resposta_certa"]:checked');

            const dados = {
                id_pergunta: id_pergunta,
                texto_pergunta: document.getElementById("texto_pergunta").value,
                resposta_certa: radio_marcado ? radio_marcado.value : ""
            };
            for (let numero = 1; numero <= 5; numero++) {
                dados["resposta_" + numero] = document.getElementById("resposta_" + numero).value;
            }

            try {
                const json = await chamarApi("api/perguntas.php?acao=alterar_multipla", dados);
                mostrarMensagem(json.mensagem, "sucesso");
            } catch (erro) {
                mostrarErro(erro);
            }
        });

        carregarPergunta();
    </script>
</body>
</html>
