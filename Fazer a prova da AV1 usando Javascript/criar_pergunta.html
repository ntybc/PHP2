<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar perguntas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Perguntas de múltipla escolha</h1>

    <!-- Aqui aparece a mensagem de sucesso ou de erro que o PHP mandou -->
    <div id="mensagem"></div>

    <form id="form_pergunta">
        <p>
            <label>Pergunta:</label><br>
            <textarea id="texto_pergunta" rows="3" cols="60" required></textarea>
        </p>

        <p>Respostas (marque a correta):</p>

        <!-- As 5 respostas são montadas pelo JavaScript lá embaixo -->
        <div id="lista_respostas"></div>

        <button type="submit">Salvar pergunta</button>
    </form>

    <p><a href="listar_perguntas.html">Ver perguntas</a> | <a href="index.html">Voltar</a></p>

    <script src="js/funcoes.js"></script>
    <script>
        // Monta as 5 respostas (igual ao for da AV1)
        let html_respostas = "";
        for (let numero = 1; numero <= 5; numero++) {
            html_respostas += `
                <p>
                    <input type="radio" name="resposta_certa" value="${numero}" required>
                    <input type="text" id="resposta_${numero}" size="60" placeholder="Resposta ${numero}" required>
                </p>`;
        }
        document.getElementById("lista_respostas").innerHTML = html_respostas;

        const formulario = document.getElementById("form_pergunta");

        formulario.addEventListener("submit", async (evento) => {
            // Não deixa o navegador mudar de página: quem manda os dados é o fetch
            evento.preventDefault();

            // Junta os valores do formulário (quem confere se está certo é o PHP)
            const radio_marcado = document.querySelector('input[name="resposta_certa"]:checked');

            const dados = {
                texto_pergunta: document.getElementById("texto_pergunta").value,
                resposta_certa: radio_marcado ? radio_marcado.value : ""
            };
            for (let numero = 1; numero <= 5; numero++) {
                dados["resposta_" + numero] = document.getElementById("resposta_" + numero).value;
            }

            try {
                const json = await chamarApi("api/perguntas.php?acao=criar_multipla", dados);
                mostrarMensagem(json.mensagem, "sucesso");
                formulario.reset(); // limpa o formulário para criar outra
            } catch (erro) {
                mostrarErro(erro);
            }
        });
    </script>
</body>
</html>
