<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar pergunta de texto</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Alterar pergunta de texto</h1>

    <!-- Aqui aparece a mensagem de sucesso ou de erro que o PHP mandou -->
    <div id="mensagem"></div>

    <!-- O formulário só aparece depois que o PHP mandar os dados da pergunta -->
    <form id="form_pergunta" style="display:none">
        <p>
            <label>Pergunta:</label><br>
            <textarea id="texto_pergunta" rows="3" cols="60" required></textarea>
        </p>

        <p>
            <label>Resposta de orientação (opcional, não tem correção):</label><br>
            <textarea id="texto_resposta" rows="3" cols="60"></textarea>
        </p>

        <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="listar_perguntas.html">Voltar para a lista</a> | <a href="index.html">Menu</a></p>

    <script src="js/funcoes.js"></script>
    <script>
        // Pega o id que veio no endereço: alterar_pergunta_texto.html?id_pergunta=3
        const id_pergunta = pegarParametro("id_pergunta");
        const formulario = document.getElementById("form_pergunta");

        // 1) Busca a pergunta no PHP e preenche o formulário
        async function carregarPergunta() {
            try {
                const json = await chamarApi("api/perguntas.php?acao=ver&id_pergunta=" + encodeURIComponent(id_pergunta));
                const pergunta = json.pergunta;

                if (pergunta.tipo_pergunta !== "texto") {
                    document.getElementById("mensagem").innerHTML =
                        `<p>Esta pergunta não é de texto. <a href="alterar_pergunta.html?id_pergunta=${pergunta.id_pergunta}">Alterar como múltipla escolha</a></p>`;
                    return;
                }

                document.getElementById("texto_pergunta").value = pergunta.texto_pergunta;

                // A resposta de orientação (se existir) é a primeira resposta da pergunta
                if (pergunta.respostas.length > 0) {
                    document.getElementById("texto_resposta").value = pergunta.respostas[0].texto_resposta;
                }

                formulario.style.display = "block";
            } catch (erro) {
                mostrarErro(erro);
            }
        }

        // 2) Quando clicar em salvar, manda os dados novos para o PHP
        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const dados = {
                id_pergunta: id_pergunta,
                texto_pergunta: document.getElementById("texto_pergunta").value,
                texto_resposta: document.getElementById("texto_resposta").value
            };

            try {
                const json = await chamarApi("api/perguntas.php?acao=alterar_texto", dados);
                mostrarMensagem(json.mensagem, "sucesso");
            } catch (erro) {
                mostrarErro(erro);
            }
        });

        carregarPergunta();
    </script>
</body>
</html>
